project_id = "minemind"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
enable_signup = true
# Players are guests: the app signs in anonymously.
enable_anonymous_sign_ins = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[auth.rate_limit]
# Local stack only (not pushed to hosted projects): e2e tests sign in many anonymous players.
anonymous_users = 1000
